{% extends "layout.html" %}

{% block content %}
<div class="card">
    <h1>Willkommen zum Quiz!</h1>
    <p>Wie sollen wir dich nennen?</p>
    <form method="POST">
        <div class="form-group">
            <input type="text" name="username" placeholder="Dein Name" required autofocus>
        </div>
        <button type="submit" class="btn">Quiz starten 🚀</button>
    </form>
</div>
{% endblock %}
