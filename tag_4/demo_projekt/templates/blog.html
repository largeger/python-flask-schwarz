{% extends "layout.html" %}

{% block content %}
    <h1>Community Blog 💬</h1>
    <div class="posts-list">
        {% for post in posts %}
            <div class="post-card">
                <h2>{{ post.title }}</h2>
                <p>{{ post.content }}</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
